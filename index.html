<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パート練習用マルチプレイヤー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-center mb-2 text-slate-900">パート練習プレイヤー</h1>
        <p class="text-sm text-slate-500 text-center mb-6">3つの音声ファイルを読み込み、同期再生・個別調整を行います。</p>

        <!-- マスターコントロールエリア -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
            <div class="flex items-center space-x-2 mb-3">
                <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" 
                    class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>
            <div class="flex justify-between text-xs text-slate-400 mb-4">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="flex justify-center space-x-3">
                <button id="play-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-lg shadow transition active:scale-95 cursor-pointer">
                    再生
                </button>
                <button id="pause-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-5 py-2 rounded-lg shadow transition active:scale-95 cursor-pointer">
                    一時停止
                </button>
                <button id="stop-btn" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-5 py-2 rounded-lg shadow transition active:scale-95 cursor-pointer">
                    停止
                </button>
            </div>
        </div>

        <!-- 各パート設定エリア -->
        <div class="space-y-4" id="parts-container">
            <!-- パートが動的に生成または配置されます -->
        </div>
    </div>

    <script>
        class PartPlayer {
            constructor(partIndex) {
                this.index = partIndex;
                this.audioCtx = null;
                this.audioBuffer = null;
                this.sourceNode = null;
                this.gainNode = null;
                
                this.isPlaying = false;
                this.isMuted = false;
                this.startTime = 0;
                this.pauseOffset = 0;
                this.volume = 1.0;
                this.duration = 0;
            }

            async loadFile(file, audioContext) {
                this.audioCtx = audioContext;
                const arrayBuffer = await file.arrayBuffer();
                this.audioBuffer = await this.audioCtx.decodeAudioData(arrayBuffer);
                this.duration = this.audioBuffer.duration;
                this.pauseOffset = 0;
                return this.duration;
            }

            play(when, offset) {
                if (!this.audioBuffer || !this.audioCtx) return;
                
                this.stop();

                this.sourceNode = this.audioCtx.createBufferSource();
                this.sourceNode.buffer = this.audioBuffer;

                this.gainNode = this.audioCtx.createGain();
                this.updateGain();

                this.sourceNode.connect(this.gainNode);
                this.gainNode.connect(this.audioCtx.destination);

                this.sourceNode.start(when, offset);
                this.isPlaying = true;

                this.sourceNode.onended = () => {
                    // 自然終了時の処理はマスター側で管理
                };
            }

            stop() {
                if (this.sourceNode) {
                    try {
                        this.sourceNode.stop();
                    } catch (e) {}
                    this.sourceNode.disconnect();
                    this.sourceNode = null;
                }
                this.isPlaying = false;
            }

            updateGain() {
                if (!this.gainNode) return;
                this.gainNode.gain.value = this.isMuted ? 0 : this.volume;
            }

            setVolume(val) {
                this.volume = val;
                this.updateGain();
            }

            setMute(muted) {
                this.isMuted = muted;
                this.updateGain();
            }
        }

        // アプリケーション管理
        const numParts = 3;
        const parts = Array.from({ length: navigator.hardwareConcurrency ? 3 : 3 }, (_, i) => new PartPlayer(i));
        let audioCtx = null;
        let isMasterPlaying = false;
        let masterStartTime = 0;
        let pausedAt = 0;
        let maxDuration = 0;
        let animationFrameId = null;

        // DOM要素の生成
        const container = document.getElementById('parts-container');
        parts.forEach((part, i) => {
            const partName = `パート ${i + 1}`;
            const div = document.createElement('div');
            div.className = 'bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col space-y-3';
            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-700">${partName}</span>
                    <input type="file" id="file-${i}" accept="audio/*" class="text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                </div>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="mute-${i}" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <span class="text-xs font-medium text-slate-600">ミュート</span>
                    </label>
                    <div class="flex items-center space-x-2 flex-1">
                        <span class="text-xs text-slate-400">音量</span>
                        <input type="range" id="vol-${i}" min="0" max="1" step="0.01" value="1" 
                            class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>
                </div>
            `;
            container.appendChild(div);

            // イベントリスナーの設定
            document.getElementById(`file-${i}`).addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const duration = await part.loadFile(file, audioCtx);
                
                // 最長の時間を持つ曲に合わせてシークバーの最大値を更新
                maxDuration = Math.max(...parts.map(p => p.duration || 0));
                document.getElementById('duration').textContent = formatTime(maxDuration);
            });

            document.getElementById(`mute-${i}`).addEventListener('change', (e) => {
                part.setMute(e.target.checked);
            });

            document.getElementById(`vol-${i}`).addEventListener('input', (e) => {
                part.setVolume(parseFloat(e.target.value));
            });
        });

        // ユーティリティ: 秒数を mm:ss に変換
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // マスター再生コントロール
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');

        playBtn.addEventListener('click', () => {
            if (isMasterPlaying) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const startTimeOffset = pausedAt;
            const contextTime = audioCtx.currentTime;

            parts.forEach(part => {
                if (part.audioBuffer) {
                    // 再生位置がそのファイルの長さを超えていない場合のみ再生
                    if (startTimeOffset < part.duration) {
                        part.play(contextTime, startTimeOffset);
                    }
                }
            });

            masterStartTime = contextTime - startTimeOffset;
            isMasterPlaying = true;
            updateProgress();
        });

        pauseBtn.addEventListener('click', () => {
            if (!isMasterPlaying) return;
            
            pausedAt = audioCtx.currentTime - masterStartTime;
            parts.forEach(part => part.stop());
            isMasterPlaying = false;
            cancelAnimationFrame(animationFrameId);
        });

        stopBtn.addEventListener('click', () => {
            parts.forEach(part => part.stop());
            isMasterPlaying = false;
            pausedAt = 0;
            cancelAnimationFrame(animationFrameId);
            seekBar.value = 0;
            currentTimeEl.textContent = "0:00";
        });

        // シークバー操作
        seekBar.addEventListener('input', (e) => {
            if (maxDuration === 0) return;
            const targetTime = (parseFloat(e.target.value) / 100) * maxDuration;
            pausedAt = targetTime;
            currentTimeEl.textContent = formatTime(targetTime);

            if (isMasterPlaying) {
                // 再生中にシークされた場合は一度止めて再開する
                parts.forEach(part => part.stop());
                const contextTime = audioCtx.currentTime;
                parts.forEach(part => {
                    if (part.audioBuffer && targetTime < part.duration) {
                        part.play(contextTime, targetTime);
                    }
                });
                masterStartTime = contextTime - targetTime;
            }
        });

        function updateProgress() {
            if (!isMasterPlaying) return;

            const current = audioCtx.currentTime - masterStartTime;
            if (current >= maxDuration) {
                // 再生終了時の処理
                stopBtn.click();
                return;
            }

            if (maxDuration > 0) {
                seekBar.value = (current / maxDuration) * 100;
                currentTimeEl.textContent = formatTime(current);
            }

            animationFrameId = requestAnimationFrame(updateProgress);
        }
    </script>
</body>
</html>
